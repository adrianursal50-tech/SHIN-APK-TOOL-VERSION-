name: Build SHIN APK

on:
  push:
    branches: [ main ]
    paths:
      - 'main.py'
      - 'DRAKVEX_ML.py'
      - 'V2.py'
      - 'buildozer.spec'
      - 'recipes/**'
      - 'icon.png'
      - 'presplash.png'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Buildozer + Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Cache Buildozer global dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build debug APK
        run: yes | buildozer -v android debug

      - name: Stage artifact
        run: |
          mkdir -p out
          for f in bin/*.apk; do
            cp "$f" "out/shin-drakvex-${{ github.run_number }}.apk"
          done
          ls -la out/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shin-drakvex-${{ github.run_number }}
          path: out/*.apk
          retention-days: 90

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SHIN build ${{ github.run_number }}
          body: |
            Auto-built APK.

            Commit: `${{ github.sha }}`
            Triggered by: @${{ github.actor }}
          files: out/*.apk
          draft: false
          prerelease: false
